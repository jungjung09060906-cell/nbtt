<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#09090b" />
  <title>RisuAI Gemini Web</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #09090b; color: #f4f4f5; }
    .glass-header { background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
  </style>
</head>
<body class="h-screen overflow-hidden antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FLASH_MODELS = [
      { id: 'gemini-2.5-flash', name: 'Gemini 2.5 Flash (권장/안정)' },
      { id: 'gemini-1.5-flash', name: 'Gemini 1.5 Flash' },
      { id: 'gemini-3.8-flash', name: 'Gemini 3.8 Flash (실험적)' },
      { id: 'gemini-3.7-flash', name: 'Gemini 3.7 Flash' },
      { id: 'gemini-3.6-flash', name: 'Gemini 3.6 Flash' },
      { id: 'gemini-3.5-flash', name: 'Gemini 3.5 Flash' }
    ];

    const DEFAULT_CHARACTERS = [
      {
        id: 'char-1',
        name: '엘레나',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300',
        description: '차분하고 세련된 인공지능 연구원',
        firstMessage: '안녕하세요. 오늘 어떤 이야기를 시작해볼까요?',
        systemPrompt: '너는 차분하고 지적인 20대 여성 연구원 엘레나이다. 섬세하고 자연스럽게 대화하며 몰입감 높은 구어체를 사용하라.'
      }
    ];

    function App() {
      // Global Settings
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('risu_api_key') || '');
      const [selectedModel, setSelectedModel] = useState('gemini-2.5-flash');
      const [userPersona, setUserPersona] = useState(() => localStorage.getItem('risu_user_persona') || '친근한 대화 상대');
      const [fontSize, setFontSize] = useState(() => localStorage.getItem('risu_font_size') || 'text-sm');
      
      // Risu AI Advanced Parameters
      const [temp, setTemp] = useState(0.85);
      const [topP, setTopP] = useState(0.95);
      const [topK, setTopK] = useState(40);
      const [presencePenalty, setPresencePenalty] = useState(0.0);
      const [frequencyPenalty, setFrequencyPenalty] = useState(0.0);
      const [maxTokens, setMaxTokens] = useState(8192);

      // Characters & Multi-Chat Sessions
      const [characters, setCharacters] = useState(() => {
        const saved = localStorage.getItem('risu_characters');
        return saved ? JSON.parse(saved) : DEFAULT_CHARACTERS;
      });
      const [activeCharId, setActiveCharId] = useState(() => characters[0]?.id || '');
      
      // Sessions structure: { [charId]: [ { id, name, messages: [] } ] }
      const [chatSessions, setChatSessions] = useState(() => {
        const saved = localStorage.getItem('risu_chat_sessions');
        if (saved) return JSON.parse(saved);
        const initChar = DEFAULT_CHARACTERS[0];
        return {
          [initChar.id]: [{ id: 'session-1', name: '기본 대화', messages: [{ id: 1, role: 'model', content: initChar.firstMessage }] }]
        };
      });
      const [activeSessionId, setActiveSessionId] = useState('session-1');

      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [activeTab, setActiveTab] = useState('chat'); // chat, char_list, char_edit, settings
      const [settingsSubTab, setSettingsSubTab] = useState('ai'); // ai, persona, ui
      const chatEndRef = useRef(null);

      // Storage sync
      useEffect(() => { localStorage.setItem('risu_api_key', apiKey); }, [apiKey]);
      useEffect(() => { localStorage.setItem('risu_user_persona', userPersona); }, [userPersona]);
      useEffect(() => { localStorage.setItem('risu_font_size', fontSize); }, [fontSize]);
      useEffect(() => { localStorage.setItem('risu_characters', JSON.stringify(characters)); }, [characters]);
      useEffect(() => { localStorage.setItem('risu_chat_sessions', JSON.stringify(chatSessions)); }, [chatSessions]);

      const activeChar = characters.find(c => c.id === activeCharId) || characters[0];
      const activeCharSessions = chatSessions[activeCharId] || [];
      const currentSession = activeCharSessions.find(s => s.id === activeSessionId) || activeCharSessions[0] || { messages: [] };

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [currentSession.messages]);

      // Handle Character Change
      const handleSelectCharacter = (charId) => {
        setActiveCharId(charId);
        let sessions = chatSessions[charId];
        if (!sessions || sessions.length === 0) {
          const char = characters.find(c => c.id === charId);
          const newSess = { id: `session-${Date.now()}`, name: '새 대화', messages: [{ id: 1, role: 'model', content: char?.firstMessage || '안녕하세요!' }] };
          setChatSessions(prev => ({ ...prev, [charId]: [newSess] }));
          setActiveSessionId(newSess.id);
        } else {
          setActiveSessionId(sessions[0].id);
        }
        setActiveTab('chat');
      };

      // Add New Character
      const handleAddCharacter = () => {
        const newChar = {
          id: `char-${Date.now()}`,
          name: '새 캐릭터',
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=300',
          description: '캐릭터 설명을 입력하세요',
          firstMessage: '안녕하세요!',
          systemPrompt: '너는 친절한 AI 어시스턴트이다.'
        };
        setCharacters(prev => [...prev, newChar]);
        handleSelectCharacter(newChar.id);
      };

      // Add New Chat Session
      const handleNewSession = () => {
        const newSess = {
          id: `session-${Date.now()}`,
          name: `대화 ${activeCharSessions.length + 1}`,
          messages: [{ id: Date.now(), role: 'model', content: activeChar.firstMessage }]
        };
        setChatSessions(prev => ({
          ...prev,
          [activeCharId]: [...(prev[activeCharId] || []), newSess]
        }));
        setActiveSessionId(newSess.id);
      };

      // Clean Contents Generator (Prevent Model Turn Error)
      const buildCleanContents = (history, newUserMsg) => {
        const contents = [];
        const fullHistory = [...history, { role: 'user', content: newUserMsg }];
        let lastRole = null;
        for (const msg of fullHistory) {
          const role = msg.role === 'user' ? 'user' : 'model';
          if (role === lastRole) {
            contents[contents.length - 1].parts[0].text += '\n' + msg.content;
          } else {
            contents.push({ role: role, parts: [{ text: msg.content }] });
            lastRole = role;
          }
        }
        while (contents.length > 0 && contents[0].role !== 'user') contents.shift();
        while (contents.length > 0 && contents[contents.length - 1].role !== 'user') contents.pop();
        return contents;
      };

      const handleSend = async () => {
        if (!input.trim() || loading) return;
        if (!apiKey) {
          alert('설정 탭에서 Gemini API Key를 입력하세요.');
          setActiveTab('settings');
          return;
        }

        const userMsg = input.trim();
        setInput('');
        
        const currentMsgs = currentSession.messages || [];
        const updatedMsgs = [...currentMsgs, { id: Date.now(), role: 'user', content: userMsg }];

        // State update for user message
        setChatSessions(prev => ({
          ...prev,
          [activeCharId]: (prev[activeCharId] || []).map(s => s.id === activeSessionId ? { ...s, messages: updatedMsgs } : s)
        }));

        setLoading(true);
        const cleanContents = buildCleanContents(currentMsgs, userMsg);

        try {
          let targetModel = selectedModel;
          let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: cleanContents,
              systemInstruction: {
                parts: [{ text: `[캐릭터 설정]\n${activeChar.systemPrompt}\n\n[유저 페르소나]\n${userPersona}` }]
              },
              generationConfig: {
                temperature: temp,
                topP: topP,
                topK: topK,
                presencePenalty: presencePenalty,
                frequencyPenalty: frequencyPenalty,
                maxOutputTokens: maxTokens
              }
            })
          });

          if (!response.ok && targetModel !== 'gemini-2.5-flash') {
            targetModel = 'gemini-2.5-flash';
            response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: cleanContents,
                systemInstruction: { parts: [{ text: `[캐릭터 설정]\n${activeChar.systemPrompt}\n\n[유저 페르소나]\n${userPersona}` }] },
                generationConfig: { temperature: temp, topP: topP, topK: topK, presencePenalty: presencePenalty, frequencyPenalty: frequencyPenalty, maxOutputTokens: maxTokens }
              })
            });
          }

          const data = await response.json();
          if (data.error) throw new Error(data.error.message || 'API 호출 에러');

          const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || '답변을 생성하지 못했습니다.';
          
          setChatSessions(prev => ({
            ...prev,
            [activeCharId]: (prev[activeCharId] || []).map(s => s.id === activeSessionId ? { ...s, messages: [...updatedMsgs, { id: Date.now() + 1, role: 'model', content: replyText }] } : s)
          }));

        } catch (err) {
          alert('오류: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="flex flex-col h-full max-w-xl mx-auto bg-zinc-950 border-x border-zinc-800/60 shadow-2xl">
          {/* Top Navigation */}
          <header className="glass-header sticky top-0 z-20 flex items-center justify-between px-4 py-3 border-b border-zinc-800/80">
            <div className="flex items-center gap-2.5 overflow-hidden">
              <img src={activeChar?.avatar} className="w-9 h-9 rounded-full object-cover ring-2 ring-indigo-500/30 shrink-0" />
              <div className="truncate">
                <h1 className="font-bold text-sm text-zinc-100 truncate">{activeChar?.name}</h1>
                <p className="text-[10px] text-zinc-400 font-mono">{selectedModel}</p>
              </div>
            </div>

            <nav className="flex bg-zinc-900 p-1 rounded-xl border border-zinc-800">
              <button onClick={() => setActiveTab('chat')} className={`px-2.5 py-1 text-xs font-semibold rounded-lg ${activeTab === 'chat' ? 'bg-indigo-600 text-white' : 'text-zinc-400'}`}>채팅</button>
              <button onClick={() => setActiveTab('char_list')} className={`px-2.5 py-1 text-xs font-semibold rounded-lg ${activeTab === 'char_list' || activeTab === 'char_edit' ? 'bg-indigo-600 text-white' : 'text-zinc-400'}`}>캐릭터</button>
              <button onClick={() => setActiveTab('settings')} className={`px-2.5 py-1 text-xs font-semibold rounded-lg ${activeTab === 'settings' ? 'bg-indigo-600 text-white' : 'text-zinc-400'}`}>설정</button>
            </nav>
          </header>

          {/* CHAT TAB */}
          {activeTab === 'chat' && (
            <div className="flex-1 flex flex-col justify-between overflow-hidden">
              {/* Session Bar */}
              <div className="flex items-center gap-2 px-4 py-2 bg-zinc-900/50 border-b border-zinc-800/50 overflow-x-auto text-xs">
                {activeCharSessions.map(s => (
                  <button 
                    key={s.id} 
                    onClick={() => setActiveSessionId(s.id)}
                    className={`px-3 py-1 rounded-lg shrink-0 ${activeSessionId === s.id ? 'bg-zinc-800 text-indigo-400 font-semibold border border-indigo-500/30' : 'text-zinc-500'}`}
                  >
                    {s.name}
                  </button>
                ))}
                <button onClick={handleNewSession} className="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg text-xs font-bold shrink-0">+ 새 대화</button>
              </div>

              {/* Chat Area */}
              <div className="flex-1 overflow-y-auto px-4 py-4 space-y-4">
                {(currentSession.messages || []).map((m) => (
                  <div key={m.id} className={`flex gap-2.5 ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    {m.role === 'model' && <img src={activeChar?.avatar} className="w-7 h-7 rounded-full object-cover mt-1 shrink-0 ring-1 ring-zinc-700" />}
                    <div className={`max-w-[82%] rounded-2xl px-4 py-2.5 ${fontSize} leading-relaxed whitespace-pre-wrap ${
                      m.role === 'user' ? 'bg-indigo-600 text-white rounded-br-xs' : 'bg-zinc-900 border border-zinc-800 text-zinc-200 rounded-bl-xs'
                    }`}>
                      {m.content}
                    </div>
                  </div>
                ))}
                {loading && <div className="text-xs text-zinc-500 pl-9">AI 답변 작성 중...</div>}
                <div ref={chatEndRef} />
              </div>

              {/* Input Area */}
              <div className="p-3 border-t border-zinc-800/80 bg-zinc-950">
                <div className="flex items-center gap-2">
                  <input 
                    type="text" 
                    value={input} 
                    onChange={(e) => setInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                    placeholder="메시지를 입력하세요..." 
                    className="flex-1 bg-zinc-900 border border-zinc-800 text-zinc-100 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500"
                  />
                  <button onClick={handleSend} disabled={loading || !input.trim()} className="px-4 py-2.5 bg-indigo-600 font-semibold text-sm rounded-xl text-white disabled:opacity-40">전송</button>
                </div>
              </div>
            </div>
          )}

          {/* CHARACTER LIST TAB */}
          {activeTab === 'char_list' && (
            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h2 className="text-sm font-bold text-zinc-100">캐릭터 목록 ({characters.length})</h2>
                <button onClick={handleAddCharacter} className="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-semibold">+ 캐릭터 추가</button>
              </div>

              <div className="space-y-3">
                {characters.map(c => (
                  <div key={c.id} className={`p-3 rounded-xl border flex items-center justify-between transition-all ${activeCharId === c.id ? 'bg-zinc-900 border-indigo-500/50' : 'bg-zinc-900/40 border-zinc-800'}`}>
                    <div className="flex items-center gap-3 flex-1 overflow-hidden cursor-pointer" onClick={() => handleSelectCharacter(c.id)}>
                      <img src={c.avatar} className="w-11 h-11 rounded-full object-cover shrink-0" />
                      <div className="truncate">
                        <h3 className="font-bold text-sm text-zinc-100">{c.name}</h3>
                        <p className="text-xs text-zinc-400 truncate">{c.description}</p>
                      </div>
                    </div>
                    <button onClick={() => { setActiveCharId(c.id); setActiveTab('char_edit'); }} className="ml-2 px-2.5 py-1 bg-zinc-800 text-zinc-300 rounded-lg text-xs font-semibold">수정</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* CHARACTER EDIT TAB */}
          {activeTab === 'char_edit' && (
            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h2 className="text-sm font-bold text-zinc-100">{activeChar?.name} 캐릭터 편집</h2>
                <button onClick={() => setActiveTab('char_list')} className="text-xs text-zinc-400">← 목록으로</button>
              </div>

              <div className="space-y-3 text-xs">
                <div>
                  <label className="text-zinc-400 font-semibold block mb-1">캐릭터 이름</label>
                  <input type="text" value={activeChar?.name} onChange={(e) => setCharacters(characters.map(c => c.id === activeCharId ? { ...c, name: e.target.value } : c))} className="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-sm text-zinc-100" />
                </div>
                <div>
                  <label className="text-zinc-400 font-semibold block mb-1">프로필 이미지 URL</label>
                  <input type="text" value={activeChar?.avatar} onChange={(e) => setCharacters(characters.map(c => c.id === activeCharId ? { ...c, avatar: e.target.value } : c))} className="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-sm text-zinc-100" />
                </div>
                <div>
                  <label className="text-zinc-400 font-semibold block mb-1">첫 메시지 (Greeting)</label>
                  <textarea value={activeChar?.firstMessage} onChange={(e) => setCharacters(characters.map(c => c.id === activeCharId ? { ...c, firstMessage: e.target.value } : c))} className="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-sm text-zinc-100 h-20" />
                </div>
                <div>
                  <label className="text-zinc-400 font-semibold block mb-1">시스템 프롬프트 (성격 및 가이드라인)</label>
                  <textarea value={activeChar?.systemPrompt} onChange={(e) => setCharacters(characters.map(c => c.id === activeCharId ? { ...c, systemPrompt: e.target.value } : c))} className="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-sm text-zinc-100 h-36" />
                </div>
              </div>
            </div>
          )}

          {/* SETTINGS TAB WITH SUB-TABS */}
          {activeTab === 'settings' && (
            <div className="flex-1 flex flex-col overflow-hidden">
              {/* Settings Sub Navigation */}
              <div className="flex bg-zinc-900 border-b border-zinc-800 px-4 py-2 text-xs font-semibold gap-2">
                <button onClick={() => setSettingsSubTab('ai')} className={`px-3 py-1.5 rounded-lg ${settingsSubTab === 'ai' ? 'bg-indigo-600 text-white' : 'text-zinc-400'}`}>API & 파라미터</button>
                <button onClick={() => setSettingsSubTab('persona')} className={`px-3 py-1.5 rounded-lg ${settingsSubTab === 'persona' ? 'bg-indigo-600 text-white' : 'text-zinc-400'}`}>유저 페르소나</button>
                <button onClick={() => setSettingsSubTab('ui')} className={`px-3 py-1.5 rounded-lg ${settingsSubTab === 'ui' ? 'bg-indigo-600 text-white' : 'text-zinc-400'}`}>UI 설정</button>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-4 text-xs">
                {/* AI & PARAMETERS */}
                {settingsSubTab === 'ai' && (
                  <div className="space-y-4">
                    <div>
                      <label className="text-zinc-400 font-semibold block mb-1">Gemini API Key</label>
                      <input type="password" value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="Google AI Studio API Key" className="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-sm text-zinc-100" />
                    </div>
                    <div>
                      <label className="text-zinc-400 font-semibold block mb-1">AI 모델</label>
                      <select value={selectedModel} onChange={(e) => setSelectedModel(e.target.value)} className="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-sm text-zinc-100">
                        {FLASH_MODELS.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                      </select>
                    </div>
                    <hr className="border-zinc-800" />
                    <div>
                      <div className="flex justify-between mb-1"><span className="text-zinc-400">Temperature (창의성)</span><span className="text-indigo-400 font-mono">{temp}</span></div>
                      <input type="range" min="0" max="2" step="0.05" value={temp} onChange={(e) => setTemp(parseFloat(e.target.value))} className="w-full accent-indigo-500" />
                    </div>
                    <div>
                      <div className="flex justify-between mb-1"><span className="text-zinc-400">Top-P (핵 샘플링)</span><span className="text-indigo-400 font-mono">{topP}</span></div>
                      <input type="range" min="0" max="1" step="0.05" value={topP} onChange={(e) => setTopP(parseFloat(e.target.value))} className="w-full accent-indigo-500" />
                    </div>
                    <div>
                      <div className="flex justify-between mb-1"><span className="text-zinc-400">Top-K</span><span className="text-indigo-400 font-mono">{topK}</span></div>
                      <input type="range" min="1" max="100" step="1" value={topK} onChange={(e) => setTopK(parseInt(e.target.value))} className="w-full accent-indigo-500" />
                    </div>
                    <div>
                      <div className="flex justify-between mb-1"><span className="text-zinc-400">Presence Penalty (주제 다양성)</span><span className="text-indigo-400 font-mono">{presencePenalty}</span></div>
                      <input type="range" min="-2" max="2" step="0.1" value={presencePenalty} onChange={(e) => setPresencePenalty(parseFloat(e.target.value))} className="w-full accent-indigo-500" />
                    </div>
                    <div>
                      <div className="flex justify-between mb-1"><span className="text-zinc-400">Frequency Penalty (단어 반복 억제)</span><span className="text-indigo-400 font-mono">{frequencyPenalty}</span></div>
                      <input type="range" min="-2" max="2" step="0.1" value={frequencyPenalty} onChange={(e) => setFrequencyPenalty(parseFloat(e.target.value))} className="w-full accent-indigo-500" />
                    </div>
                  </div>
                )}

                {/* USER PERSONA */}
                {settingsSubTab === 'persona' && (
                  <div>
                    <label className="text-zinc-400 font-semibold block mb-1">내 페르소나 (유저 설정)</label>
                    <textarea value={userPersona} onChange={(e) => setUserPersona(e.target.value)} placeholder="AI가 나를 인식하는 정보나 말투를 자유롭게 입력하세요." className="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-100 h-48 focus:border-indigo-500" />
                  </div>
                )}

                {/* UI SETTINGS */}
                {settingsSubTab === 'ui' && (
                  <div className="space-y-4">
                    <div>
                      <label className="text-zinc-400 font-semibold block mb-1">채팅 글자 크기</label>
                      <select value={fontSize} onChange={(e) => setFontSize(e.target.value)} className="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-sm text-zinc-100">
                        <option value="text-xs">작게 (12px)</option>
                        <option value="text-sm">보통 (14px)</option>
                        <option value="text-base">크게 (16px)</option>
                      </select>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
