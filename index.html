<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#181816" />
  <title>RisuAI Native Web</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { font-family: 'Pretendard', -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; height: 100dvh; overflow: hidden; background-color: #1e1e1a; color: #d4d4d0; }
    #root { height: 100%; height: 100dvh; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #383832; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FLASH_MODELS = [
      { id: 'gemini-3.8-flash', name: 'Gemini 3.8 Flash' },
      { id: 'gemini-3.7-flash', name: 'Gemini 3.7 Flash' },
      { id: 'gemini-3.6-flash', name: 'Gemini 3.6 Flash' },
      { id: 'gemini-3.5-flash', name: 'Gemini 3.5 Flash' }
    ];

    // 무지개 단색 프사 컬러 뱅크
    const COLOR_PALETTE = [
      '#EF4444', // Red
      '#F97316', // Orange
      '#EAB308', // Yellow
      '#22C55E', // Green
      '#3B82F6', // Blue
      '#6366F1', // Indigo
      '#A855F7'  // Purple
    ];

    const DEFAULT_CHARACTERS = [
      {
        id: 'char-1',
        name: 'Character Name',
        avatarColor: '#EF4444',
        description: '캐릭터 설명을 입력하세요',
        firstMessage: '안녕하세요. 무엇을 도와드릴까요?',
        systemPrompt: '너는 친절하고 다정한 인공지능 어시스턴트이다.'
      }
    ];

    const RISU_BUILTIN_MAIN_PROMPT = `In this fictional roleplay of {{char}}, craft a detailed and immersive experience that showcases your expertise.

* Compose a response for {{char}} as they interact with {{user}} in a vivid and engaging manner.
* Be proactive and creative in driving the plot and conversation forward.
* Adhere to the settings and worldview that {{char}} belongs to, while also being prepared for {{user}} to change these at any time.
* Allow {{char}}'s personality, culture, tone of voice, and other aspects to evolve as the conversation progresses.
* Describe using at least two of the following senses: sight, sound, smell, touch, or taste.
* Do not write {{user}}'s responses, break the established worldview, or write messages from {{user}}'s perspective.
* Describe non-dialogues inside asterisks (*action*).
* Always maintain a craftsmanlike spirit and stay strictly in character.`;

    function App() {
      // Sidebar State
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [sidebarTab, setSidebarTab] = useState('chat');

      // UI / Text Scale State
      const [uiScale, setUiScale] = useState(() => Number(localStorage.getItem('risu_ui_scale')) || 100);
      const [textScale, setTextScale] = useState(() => Number(localStorage.getItem('risu_text_scale')) || 13);

      // Settings State
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('risu_api_key') || '');
      const [selectedModel, setSelectedModel] = useState('gemini-3.8-flash');
      const [userName, setUserName] = useState(() => localStorage.getItem('risu_user_name') || 'User');
      const [userPersona, setUserPersona] = useState(() => localStorage.getItem('risu_user_persona') || '');

      // Characters & Chat Sessions State
      const [characters, setCharacters] = useState(() => {
        const saved = localStorage.getItem('risu_characters');
        return saved ? JSON.parse(saved) : DEFAULT_CHARACTERS;
      });
      const [activeCharId, setActiveCharId] = useState(() => characters[0]?.id || '');

      const [chatSessions, setChatSessions] = useState(() => {
        const saved = localStorage.getItem('risu_chat_sessions');
        if (saved) return JSON.parse(saved);
        const initChar = DEFAULT_CHARACTERS[0];
        return {
          [initChar.id]: [
            { id: 'session-1', name: 'Chat 1', messages: [{ id: 'init-msg', role: 'model', content: initChar.firstMessage }] }
          ]
        };
      });
      const [activeSessionId, setActiveSessionId] = useState('session-1');

      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const chatEndRef = useRef(null);

      // Sync LocalStorage
      useEffect(() => { localStorage.setItem('risu_api_key', apiKey); }, [apiKey]);
      useEffect(() => { localStorage.setItem('risu_user_name', userName); }, [userName]);
      useEffect(() => { localStorage.setItem('risu_user_persona', userPersona); }, [userPersona]);
      useEffect(() => { localStorage.setItem('risu_characters', JSON.stringify(characters)); }, [characters]);
      useEffect(() => { localStorage.setItem('risu_chat_sessions', JSON.stringify(chatSessions)); }, [chatSessions]);
      useEffect(() => { localStorage.setItem('risu_ui_scale', uiScale); }, [uiScale]);
      useEffect(() => { localStorage.setItem('risu_text_scale', textScale); }, [textScale]);

      const activeChar = characters.find(c => c.id === activeCharId) || characters[0];
      const activeCharSessions = chatSessions[activeCharId] || [];
      const currentSession = activeCharSessions.find(s => s.id === activeSessionId) || activeCharSessions[0] || { messages: [] };

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [currentSession.messages]);

      // Handle First Message Update Across Chat Sessions
      const handleFirstMessageChange = (newFirstMsg) => {
        setCharacters(characters.map(c => c.id === activeCharId ? { ...c, firstMessage: newFirstMsg } : c));
        
        // 동기화: 첫 메시지(인덱스 0) 내용 수정
        setChatSessions(prev => {
          const charSessions = prev[activeCharId] || [];
          const updatedSessions = charSessions.map(sess => {
            if (sess.messages && sess.messages.length > 0 && sess.messages[0].id === 'init-msg') {
              const newMsgs = [...sess.messages];
              newMsgs[0] = { ...newMsgs[0], content: newFirstMsg };
              return { ...sess, messages: newMsgs };
            }
            return sess;
          });
          return { ...prev, [activeCharId]: updatedSessions };
        });
      };

      // Select Character
      const handleSelectCharacter = (charId) => {
        setActiveCharId(charId);
        let sessions = chatSessions[charId];
        if (!sessions || sessions.length === 0) {
          const char = characters.find(c => c.id === charId);
          const newSess = { id: `session-${Date.now()}`, name: 'Chat 1', messages: [{ id: 'init-msg', role: 'model', content: char?.firstMessage || '안녕하세요!' }] };
          setChatSessions(prev => ({ ...prev, [charId]: [newSess] }));
          setActiveSessionId(newSess.id);
        } else {
          setActiveSessionId(sessions[0].id);
        }
      };

      // Add New Session
      const handleNewSession = () => {
        const targetSessions = chatSessions[activeCharId] || [];
        const newSess = {
          id: `session-${Date.now()}`,
          name: `Chat ${targetSessions.length + 1}`,
          messages: [{ id: 'init-msg', role: 'model', content: activeChar.firstMessage }]
        };
        setChatSessions(prev => ({ ...prev, [activeCharId]: [...(prev[activeCharId] || []), newSess] }));
        setActiveSessionId(newSess.id);
      };

      // Add New Character with Solid Colors
      const handleAddCharacter = () => {
        const nextColor = COLOR_PALETTE[characters.length % COLOR_PALETTE.length];
        const newChar = {
          id: `char-${Date.now()}`,
          name: 'New Character',
          avatarColor: nextColor,
          description: '',
          firstMessage: '안녕하세요!',
          systemPrompt: '너는 AI 어시스턴트이다.'
        };
        setCharacters(prev => [...prev, newChar]);
        handleSelectCharacter(newChar.id);
      };

      // Delete Character
      const handleDeleteCharacter = () => {
        if (characters.length <= 1) {
          alert('최소 하나 이상의 캐릭터는 존재해야 합니다.');
          return;
        }
        if (window.confirm('정말로 이 캐릭터와 대화 기록을 삭제하시겠습니까?')) {
          const newChars = characters.filter(c => c.id !== activeCharId);
          setCharacters(newChars);
          
          const newSessions = { ...chatSessions };
          delete newSessions[activeCharId];
          setChatSessions(newSessions);

          handleSelectCharacter(newChars[0].id);
        }
      };

      // Delete Message
      const handleDeleteMessage = (msgId) => {
        const updatedMsgs = currentSession.messages.filter(m => m.id !== msgId);
        setChatSessions(prev => ({
          ...prev,
          [activeCharId]: (prev[activeCharId] || []).map(s => s.id === activeSessionId ? { ...s, messages: updatedMsgs } : s)
        }));
      };

      // API Request Helper
      const fetchAIResponse = async (msgsToSend) => {
        let processedMainPrompt = RISU_BUILTIN_MAIN_PROMPT
          .replaceAll('{{char}}', activeChar?.name || 'Character')
          .replaceAll('{{user}}', userName || 'User');

        const charPrompt = (activeChar?.systemPrompt || '')
          .replaceAll('{{char}}', activeChar?.name || 'Character')
          .replaceAll('{{user}}', userName || 'User');

        const fullSystemInstruction = `${processedMainPrompt}\n\n[Character Setting: ${activeChar?.name}]\nDescription: ${activeChar?.description || ''}\nPersonality & Rules: ${charPrompt}\n\n[User Info]\nName: ${userName}\nPersona: ${userPersona}`;

        const contents = msgsToSend.map(m => ({
          role: m.role === 'user' ? 'user' : 'model',
          parts: [{ text: m.content }]
        }));

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: contents,
            systemInstruction: { parts: [{ text: fullSystemInstruction }] }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || 'API 오류');
        return data.candidates?.[0]?.content?.parts?.[0]?.text || '답변을 생성할 수 없습니다.';
      };

      // Send Message
      const handleSend = async () => {
        if (!input.trim() || loading) return;
        if (!apiKey) {
          alert('사이드바 메뉴 > 설정에서 Gemini API Key를 입력하세요.');
          setSidebarOpen(true);
          setSidebarTab('settings');
          return;
        }

        const userMsg = input.trim();
        setInput('');

        const currentMsgs = currentSession.messages || [];
        const updatedMsgs = [...currentMsgs, { id: Date.now(), role: 'user', content: userMsg }];

        setChatSessions(prev => ({
          ...prev,
          [activeCharId]: (prev[activeCharId] || []).map(s => s.id === activeSessionId ? { ...s, messages: updatedMsgs } : s)
        }));

        setLoading(true);

        try {
          const replyText = await fetchAIResponse(updatedMsgs);
          setChatSessions(prev => ({
            ...prev,
            [activeCharId]: (prev[activeCharId] || []).map(s => s.id === activeSessionId ? { ...s, messages: [...updatedMsgs, { id: Date.now() + 1, role: 'model', content: replyText }] } : s)
          }));
        } catch (err) {
          alert('오류: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      // Retry / Regenerate
      const handleRetry = async (msgIndex) => {
        if (loading) return;
        if (!apiKey) {
          alert('설정에서 API Key를 확인하세요.');
          return;
        }

        const currentMsgs = currentSession.messages || [];
        const targetMsgs = currentMsgs.slice(0, currentMsgs[msgIndex].role === 'model' ? msgIndex : msgIndex + 1);

        setLoading(true);

        try {
          const replyText = await fetchAIResponse(targetMsgs);
          setChatSessions(prev => ({
            ...prev,
            [activeCharId]: (prev[activeCharId] || []).map(s => s.id === activeSessionId ? { ...s, messages: [...targetMsgs, { id: Date.now(), role: 'model', content: replyText }] } : s)
          }));
        } catch (err) {
          alert('오류: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div style={{ zoom: `${uiScale}%` }} className="flex h-full w-full bg-[#1e1e1a] text-[#d4d4d0] relative overflow-hidden">
          
          {/* LEFT SLIDING SIDEBAR */}
          <div className={`fixed inset-y-0 left-0 z-50 flex w-[280px] sm:w-[320px] bg-[#181816] transition-transform duration-200 ease-in-out border-r border-[#2d2d28] ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
            
            {/* Leftmost Vertical Icon Bar */}
            <div className="w-[48px] bg-[#141412] flex flex-col items-center py-2 space-y-2 border-r border-[#262622] shrink-0">
              <button onClick={() => setSidebarOpen(false)} className="w-8 h-8 flex items-center justify-center bg-[#282824] hover:bg-[#33332d] rounded-lg text-zinc-300">
                &larr;
              </button>
              
              <div className="w-full border-t border-[#262622] my-0.5"></div>

              {/* Character Solid Color Avatars List */}
              <div className="flex-1 overflow-y-auto space-y-2 w-full flex flex-col items-center">
                {characters.map(c => (
                  <button 
                    key={c.id} 
                    onClick={() => handleSelectCharacter(c.id)} 
                    style={{ backgroundColor: c.avatarColor || '#EF4444' }} 
                    className={`w-8 h-8 rounded-lg flex items-center justify-center text-white font-bold text-xs shadow-inner border ${activeCharId === c.id ? 'border-amber-400 ring-2 ring-amber-400/50 scale-105' : 'border-black/20'}`}
                  >
                    {c.name ? c.name[0].toUpperCase() : 'C'}
                  </button>
                ))}
                <button onClick={handleAddCharacter} className="w-8 h-8 bg-[#242420] hover:bg-[#33332d] rounded-lg border border-[#33332d] flex items-center justify-center text-zinc-400 font-bold">+</button>
              </div>

              {/* Bottom Settings Icon */}
              <button onClick={() => setSidebarTab('settings')} className="w-8 h-8 bg-[#242420] hover:bg-[#33332d] rounded-lg border border-[#33332d] flex items-center justify-center text-zinc-400">
                ⚙️
              </button>
            </div>

            {/* Sidebar Content Area */}
            <div className="flex-1 flex flex-col h-full bg-[#181816] overflow-hidden">
              {/* Top Sub Tabs (챗 / 캐릭터) */}
              <div className="flex border-b border-[#2a2a24] p-1.5 gap-1 bg-[#161614]">
                <button onClick={() => setSidebarTab('chat')} className={`flex-1 py-1 rounded text-xs font-semibold ${sidebarTab === 'chat' ? 'bg-[#2b2b25] text-amber-200/90' : 'text-zinc-500'}`}>챗</button>
                <button onClick={() => setSidebarTab('character')} className={`flex-1 py-1 rounded text-xs font-semibold ${sidebarTab === 'character' ? 'bg-[#2b2b25] text-amber-200/90' : 'text-zinc-500'}`}>캐릭터</button>
              </div>

              <div className="flex-1 overflow-y-auto p-2.5 space-y-3">
                {/* CHAT TAB IN SIDEBAR */}
                {sidebarTab === 'chat' && (
                  <div className="space-y-2">
                    <button onClick={handleNewSession} className="w-full py-1.5 bg-[#2a2a24] hover:bg-[#33332c] text-amber-100/90 rounded-md font-medium text-xs border border-[#383830]">
                      새 채팅
                    </button>

                    <div className="space-y-1">
                      {activeCharSessions.map(s => (
                        <div key={s.id} onClick={() => { setActiveSessionId(s.id); setSidebarOpen(false); }} className={`flex items-center justify-between p-2 rounded-md cursor-pointer border ${activeSessionId === s.id ? 'bg-[#282822] border-amber-500/40 text-amber-200/90' : 'bg-[#1e1e1a] border-[#2a2a24] text-zinc-400'}`}>
                          <span className="text-xs truncate font-medium">{s.name}</span>
                          <span className="text-[10px] text-zinc-600">⋮</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* CHARACTER TAB IN SIDEBAR */}
                {sidebarTab === 'character' && (
                  <div className="space-y-2.5 text-xs">
                    <div>
                      <label className="text-zinc-500 block mb-0.5">Character Name</label>
                      <input type="text" value={activeChar?.name} onChange={(e) => setCharacters(characters.map(c => c.id === activeCharId ? { ...c, name: e.target.value } : c))} className="w-full bg-[#1e1e1a] border border-[#2d2d27] rounded p-1.5 text-zinc-200" />
                    </div>
                    <div>
                      <label className="text-zinc-500 block mb-0.5">설명 ⑨</label>
                      <textarea value={activeChar?.description} onChange={(e) => setCharacters(characters.map(c => c.id === activeCharId ? { ...c, description: e.target.value } : c))} className="w-full bg-[#1e1e1a] border border-[#2d2d27] rounded p-1.5 text-zinc-200 h-16" />
                    </div>
                    <div>
                      <label className="text-zinc-500 block mb-0.5">첫 메시지 ⑨</label>
                      <textarea value={activeChar?.firstMessage} onChange={(e) => handleFirstMessageChange(e.target.value)} className="w-full bg-[#1e1e1a] border border-[#2d2d27] rounded p-1.5 text-zinc-200 h-16" />
                    </div>
                    <div>
                      <label className="text-zinc-500 block mb-0.5">시스템 프롬프트</label>
                      <textarea value={activeChar?.systemPrompt} onChange={(e) => setCharacters(characters.map(c => c.id === activeCharId ? { ...c, systemPrompt: e.target.value } : c))} className="w-full bg-[#1e1e1a] border border-[#2d2d27] rounded p-1.5 text-zinc-200 h-20" />
                    </div>

                    <div className="pt-6 pb-2">
                      <button onClick={handleDeleteCharacter} className="w-full py-2 bg-red-950/40 hover:bg-red-900/60 text-red-300 rounded border border-red-800/50 transition">
                        🗑️ 캐릭터 삭제
                      </button>
                    </div>
                  </div>
                )}

                {/* SETTINGS TAB IN SIDEBAR */}
                {sidebarTab === 'settings' && (
                  <div className="space-y-3 text-xs">
                    <div>
                      <label className="text-zinc-400 block mb-0.5">UI 스케일 ({uiScale}%)</label>
                      <input type="range" min="70" max="130" value={uiScale} onChange={(e) => setUiScale(Number(e.target.value))} className="w-full accent-amber-500" />
                    </div>
                    <div>
                      <label className="text-zinc-400 block mb-0.5">텍스트 크기 ({textScale}px)</label>
                      <input type="range" min="10" max="20" value={textScale} onChange={(e) => setTextScale(Number(e.target.value))} className="w-full accent-amber-500" />
                    </div>

                    <hr className="border-[#2a2a24]" />

                    <div>
                      <label className="text-zinc-400 block mb-0.5">Gemini API Key</label>
                      <input type="password" value={apiKey} onChange={(e) => setApiKey(e.target.value)} className="w-full bg-[#1e1e1a] border border-[#2d2d27] rounded p-1.5 text-zinc-200" />
                    </div>
                    <div>
                      <label className="text-zinc-400 block mb-0.5">AI 모델</label>
                      <select value={selectedModel} onChange={(e) => setSelectedModel(e.target.value)} className="w-full bg-[#1e1e1a] border border-[#2d2d27] rounded p-1.5 text-zinc-200">
                        {FLASH_MODELS.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                      </select>
                    </div>
                    
                    <hr className="border-[#2a2a24]" />

                    <div>
                      <label className="text-zinc-400 block mb-0.5">유저 이름 (User Name)</label>
                      <input type="text" value={userName} onChange={(e) => setUserName(e.target.value)} className="w-full bg-[#1e1e1a] border border-[#2d2d27] rounded p-1.5 text-zinc-200" />
                    </div>
                    <div>
                      <label className="text-zinc-400 block mb-0.5">유저 페르소나 (User Persona)</label>
                      <textarea value={userPersona} onChange={(e) => setUserPersona(e.target.value)} className="w-full bg-[#1e1e1a] border border-[#2d2d27] rounded p-1.5 text-zinc-200 h-20" />
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* MAIN CHAT AREA */}
          <div className="flex-1 flex flex-col h-full relative overflow-hidden">
            
            {/* Top Navigation Button */}
            <div className="p-2 flex items-center shrink-0">
              <button onClick={() => setSidebarOpen(true)} className="p-1.5 bg-[#252520] hover:bg-[#30302a] border border-[#33332c] rounded-md text-zinc-300 flex items-center justify-center">
                &rarr;
              </button>
            </div>

            {/* Chat Body */}
            <div className="flex-1 overflow-y-auto px-3 py-1 space-y-3" style={{ fontSize: `${textScale}px` }}>
              {currentSession.messages?.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-center text-zinc-500 space-y-1">
                  <p className="text-xs">콘텐츠는 AI로 생성되며 부정확하거나 편향된 정보가 포함될 수 있습니다.</p>
                  <p className="text-xs">무언가 입력하여 채팅을 시작하세요.</p>
                </div>
              ) : (
                currentSession.messages?.map((m, idx) => {
                  const isFirstMsg = idx === 0 && m.id === 'init-msg';
                  return (
                    <div key={m.id} className={`flex flex-col ${m.role === 'user' ? 'items-end' : 'items-start'}`}>
                      <div className={`max-w-[88%] p-2.5 rounded-lg leading-relaxed relative group whitespace-pre-wrap ${m.role === 'user' ? 'bg-[#2b2a22] text-amber-100 border border-[#38372d]' : 'bg-[#181816] text-zinc-300 border border-[#282824]'}`}>
                        {m.content}
                        
                        {/* Message Control Buttons */}
                        <div className="flex items-center space-x-2 justify-end mt-1.5 pt-1 border-t border-zinc-700/30 text-[10px] text-zinc-500">
                          <button onClick={() => handleRetry(idx)} className="hover:text-amber-300 transition">🔄 다시시도</button>
                          {/* 첫 메시지는 삭제 버튼 미표시 */}
                          {!isFirstMsg && (
                            <button onClick={() => handleDeleteMessage(m.id)} className="hover:text-red-400 transition">🗑️ 삭제</button>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
              {loading && <div className="text-xs text-zinc-500">답변 작성 중...</div>}
              <div ref={chatEndRef} />
            </div>

            {/* Bottom Input Area */}
            <div className="p-2.5 bg-[#181816] border-t border-[#262622] shrink-0">
              <div className="relative flex items-center bg-[#1e1e1a] border border-[#2e2e28] rounded-md p-1.5">
                <input 
                  type="text" 
                  value={input} 
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                  placeholder="무언가 입력하여 채팅을 시작하세요." 
                  className="w-full bg-transparent text-xs text-zinc-200 placeholder-zinc-600 focus:outline-none pr-28"
                  style={{ fontSize: `${textScale}px` }}
                />
                
                {/* 우측 버튼 영역 (크고 누르기 편한 전송 버튼) */}
                <div className="absolute right-1 flex items-center space-x-1 text-zinc-400">
                  <button 
                    onClick={handleSend} 
                    disabled={loading || !input.trim()} 
                    className="px-3 py-1.5 bg-amber-600/80 hover:bg-amber-500 text-white rounded font-bold text-xs transition disabled:opacity-30 disabled:hover:bg-amber-600/80"
                  >
                    전송 ➔
                  </button>
                  <button onClick={() => setSidebarOpen(true)} className="p-1.5 hover:text-zinc-200 text-base">
                    ≡
                  </button>
                </div>
              </div>
              <p className="text-[9px] text-center text-zinc-600 mt-1">콘텐츠는 AI로 생성되며 부정확하거나 편향된 정보가 포함될 수 있습니다.</p>
            </div>

          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
