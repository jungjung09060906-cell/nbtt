<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Character Chat</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0d0d0d; color: #e5e5e5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #171717; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FLASH_MODELS = [
      { id: 'gemini-2.5-flash', name: 'Gemini 2.5 Flash (권장/안정)' },
      { id: 'gemini-1.5-flash', name: 'Gemini 1.5 Flash' },
      { id: 'gemini-3.8-flash', name: 'Gemini 3.8 Flash (실험적)' },
      { id: 'gemini-3.7-flash', name: 'Gemini 3.7 Flash' },
      { id: 'gemini-3.6-flash', name: 'Gemini 3.6 Flash' },
      { id: 'gemini-3.5-flash', name: 'Gemini 3.5 Flash' }
    ];

    const DEFAULT_CHAR = {
      id: 'default-1',
      name: '엘레나',
      avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
      description: '조용하고 지적인 인공지능 연구원.',
      firstMessage: '안녕하세요. 오늘 어떤 이야기를 나누고 싶으신가요?',
      systemPrompt: '너는 차분하고 지적인 20대 여성 연구원 엘레나이다. 매너 있고 정중하게 대화하라.'
    };

    function App() {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini_api_key') || '');
      const [selectedModel, setSelectedModel] = useState('gemini-2.5-flash');
      const [temp, setTemp] = useState(0.7);
      const [topP, setTopP] = useState(0.95);
      const [maxTokens, setMaxTokens] = useState(32000);
      
      const [character, setCharacter] = useState(() => {
        const saved = localStorage.getItem('char_data');
        return saved ? JSON.parse(saved) : DEFAULT_CHAR;
      });

      const [userPersona, setUserPersona] = useState(() => localStorage.getItem('user_persona') || '친근한 대화 상대');
      
      const [messages, setMessages] = useState(() => {
        const saved = localStorage.getItem('chat_history');
        return saved ? JSON.parse(saved) : [{ id: 1, role: 'model', content: DEFAULT_CHAR.firstMessage }];
      });

      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [activeTab, setActiveTab] = useState('chat'); // chat, char, settings
      const chatEndRef = useRef(null);

      useEffect(() => { localStorage.setItem('gemini_api_key', apiKey); }, [apiKey]);
      useEffect(() => { localStorage.setItem('char_data', JSON.stringify(character)); }, [character]);
      useEffect(() => { localStorage.setItem('user_persona', userPersona); }, [userPersona]);
      useEffect(() => { 
        localStorage.setItem('chat_history', JSON.stringify(messages));
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      // API 호출 시 턴 순서 정제 (Requests ending with a model turn are not supported 에러 방지)
      const buildCleanContents = (history, newUserMsg) => {
        const contents = [];
        const fullHistory = [...history, { role: 'user', content: newUserMsg }];
        
        let lastRole = null;
        for (const msg of fullHistory) {
          const role = msg.role === 'user' ? 'user' : 'model';
          if (role === lastRole) {
            // 연속된 같은 턴은 이전 내용에 합침
            contents[contents.length - 1].parts[0].text += '\n' + msg.content;
          } else {
            contents.push({ role: role, parts: [{ text: msg.content }] });
            lastRole = role;
          }
        }

        // 구글 API 규칙: 시작은 반드시 user, 끝도 반드시 user여야 함
        while (contents.length > 0 && contents[0].role !== 'user') {
          contents.shift();
        }
        while (contents.length > 0 && contents[contents.length - 1].role !== 'user') {
          contents.pop();
        }

        return contents;
      };

      const handleSend = async () => {
        if (!input.trim() || loading) return;
        if (!apiKey) {
          alert('설정 탭에서 Gemini API Key를 입력해주세요.');
          setActiveTab('settings');
          return;
        }

        const userMsg = input.trim();
        setInput('');
        const newHistory = [...messages, { id: Date.now(), role: 'user', content: userMsg }];
        setMessages(newHistory);
        setLoading(true);

        const cleanContents = buildCleanContents(messages, userMsg);

        try {
          // 호출 모델 및 폴백 모델 처리
          let targetModel = selectedModel;
          let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: cleanContents,
              systemInstruction: {
                parts: [{ text: `[캐릭터 설정]\n${character.systemPrompt}\n\n[유저 페르소나]\n${userPersona}` }]
              },
              generationConfig: {
                temperature: temp,
                topP: topP,
                maxOutputTokens: maxTokens
              }
            })
          });

          // 3.8 등 지원 안되거나 404/400 발생 시 2.5 Flash로 자동 폴백
          if (!response.ok && targetModel !== 'gemini-2.5-flash') {
            console.warn(`[${targetModel}] 호출 실패. gemini-2.5-flash로 폴백합니다.`);
            targetModel = 'gemini-2.5-flash';
            response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: cleanContents,
                systemInstruction: {
                  parts: [{ text: `[캐릭터 설정]\n${character.systemPrompt}\n\n[유저 페르소나]\n${userPersona}` }]
                },
                generationConfig: {
                  temperature: temp,
                  topP: topP,
                  maxOutputTokens: maxTokens
                }
              })
            });
          }

          const data = await response.json();
          if (data.error) throw new Error(data.error.message || 'API 오류 발생');

          const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || '답변을 생성하지 못했습니다.';
          setMessages(prev => [...prev, { id: Date.now() + 1, role: 'model', content: replyText }]);

        } catch (err) {
          alert('에러 발생: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleResetChat = () => {
        if (confirm('대화 기록을 초기화하시겠습니까?')) {
          setMessages([{ id: Date.now(), role: 'model', content: character.firstMessage }]);
        }
      };

      return (
        <div className="flex flex-col h-screen max-w-2xl mx-auto bg-neutral-950 text-neutral-200 border-x border-neutral-800">
          {/* Header */}
          <header className="flex items-center justify-between p-4 border-b border-neutral-800 bg-neutral-900">
            <div className="flex items-center gap-3">
              <img src={character.avatar} className="w-10 h-10 rounded-full object-cover border border-neutral-700" />
              <div>
                <h1 className="font-bold text-base text-neutral-100">{character.name}</h1>
                <p className="text-xs text-neutral-400">{selectedModel}</p>
              </div>
            </div>
            <div className="flex gap-2 text-xs">
              <button onClick={() => setActiveTab('chat')} className={`px-3 py-1.5 rounded-md ${activeTab==='chat'?'bg-neutral-700 text-white':'bg-neutral-800 text-neutral-400'}`}>채팅</button>
              <button onClick={() => setActiveTab('char')} className={`px-3 py-1.5 rounded-md ${activeTab==='char'?'bg-neutral-700 text-white':'bg-neutral-800 text-neutral-400'}`}>캐릭터</button>
              <button onClick={() => setActiveTab('settings')} className={`px-3 py-1.5 rounded-md ${activeTab==='settings'?'bg-neutral-700 text-white':'bg-neutral-800 text-neutral-400'}`}>설정</button>
            </div>
          </header>

          {/* Main Area */}
          {activeTab === 'chat' && (
            <div className="flex-1 flex flex-col justify-between overflow-hidden">
              <div className="flex-1 overflow-y-auto p-4 space-y-4">
                {messages.map((m) => (
                  <div key={m.id} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-sm whitespace-pre-wrap leading-relaxed ${
                      m.role === 'user' 
                        ? 'bg-neutral-200 text-neutral-900 rounded-br-none' 
                        : 'bg-neutral-800 text-neutral-100 border border-neutral-700 rounded-bl-none'
                    }`}>
                      {m.content}
                    </div>
                  </div>
                ))}
                {loading && <div className="text-xs text-neutral-500 italic">답변 작성 중...</div>}
                <div ref={chatEndRef} />
              </div>

              {/* Input */}
              <div className="p-3 border-t border-neutral-800 bg-neutral-900 flex gap-2">
                <button onClick={handleResetChat} className="px-3 py-2 bg-neutral-800 border border-neutral-700 text-xs rounded-lg text-neutral-400 hover:text-white">초기화</button>
                <input 
                  type="text" 
                  value={input} 
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                  placeholder="메시지를 입력하세요..." 
                  className="flex-1 bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-neutral-600"
                />
                <button onClick={handleSend} disabled={loading} className="px-4 py-2 bg-neutral-100 text-neutral-900 font-bold text-sm rounded-lg hover:bg-white disabled:opacity-50">전송</button>
              </div>
            </div>
          )}

          {activeTab === 'char' && (
            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              <h2 className="font-bold text-lg border-b border-neutral-800 pb-2">캐릭터 설정</h2>
              <div>
                <label className="text-xs text-neutral-400 block mb-1">이름</label>
                <input type="text" value={character.name} onChange={(e)=>setCharacter({...character, name:e.target.value})} className="w-full bg-neutral-900 border border-neutral-800 rounded p-2 text-sm" />
              </div>
              <div>
                <label className="text-xs text-neutral-400 block mb-1">프로필 이미지 URL</label>
                <input type="text" value={character.avatar} onChange={(e)=>setCharacter({...character, avatar:e.target.value})} className="w-full bg-neutral-900 border border-neutral-800 rounded p-2 text-sm" />
              </div>
              <div>
                <label className="text-xs text-neutral-400 block mb-1">첫 메시지 (Greeting)</label>
                <textarea value={character.firstMessage} onChange={(e)=>setCharacter({...character, firstMessage:e.target.value})} className="w-full bg-neutral-900 border border-neutral-800 rounded p-2 text-sm h-20" />
              </div>
              <div>
                <label className="text-xs text-neutral-400 block mb-1">시스템 프롬프트 (페르소나)</label>
                <textarea value={character.systemPrompt} onChange={(e)=>setCharacter({...character, systemPrompt:e.target.value})} className="w-full bg-neutral-900 border border-neutral-800 rounded p-2 text-sm h-36" />
              </div>
            </div>
          )}

          {activeTab === 'settings' && (
            <div className="flex-1 overflow-y-auto p-4 space-y-5">
              <h2 className="font-bold text-lg border-b border-neutral-800 pb-2">API 및 모델 설정</h2>
              <div>
                <label className="text-xs text-neutral-400 block mb-1">Gemini API Key</label>
                <input type="password" value={apiKey} onChange={(e)=>setApiKey(e.target.value)} placeholder="AI Studio 키 입력" className="w-full bg-neutral-900 border border-neutral-800 rounded p-2 text-sm" />
              </div>
              <div>
                <label className="text-xs text-neutral-400 block mb-1">모델 선택</label>
                <select value={selectedModel} onChange={(e)=>setSelectedModel(e.target.value)} className="w-full bg-neutral-900 border border-neutral-800 rounded p-2 text-sm">
                  {FLASH_MODELS.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                </select>
              </div>
              <div>
                <label className="text-xs text-neutral-400 block mb-1">Temperature ({temp})</label>
                <input type="range" min="0" max="2" step="0.1" value={temp} onChange={(e)=>setTemp(parseFloat(e.target.value))} className="w-full" />
              </div>
              <div>
                <label className="text-xs text-neutral-400 block mb-1">Max Output Tokens ({maxTokens})</label>
                <input type="range" min="1000" max="32000" step="1000" value={maxTokens} onChange={(e)=>setMaxTokens(parseInt(e.target.value))} className="w-full" />
              </div>
              <div>
                <label className="text-xs text-neutral-400 block mb-1">유저 페르소나</label>
                <textarea value={userPersona} onChange={(e)=>setUserPersona(e.target.value)} className="w-full bg-neutral-900 border border-neutral-800 rounded p-2 text-sm h-20" />
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
