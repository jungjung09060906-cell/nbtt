  modal(`<div class=bd><div class=row><b style="flex:1">${t('aiwarn')}</b><button data-a=closeM style="flex:0">✕</button></div><div class=row style="margin:10px 0">${tab('tok',t('ttok'))}${tab('meta',t('tmeta'))}</div>${body}</div>`)}});
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&act[a.dataset.a])act[a.dataset.a](a.dataset.id)});
render();
try{navigator.storage?.persist?.()}catch{}
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
